name: Revisie controle

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  repository-projects: write

env:
  ORG: IDgis
  TARGET_PROJECT: "15"
  EXPIRED_LABEL: "revisie-verlopen"

jobs:
  revisie-check:
    runs-on: ubuntu-latest

    steps:
      - name: Controleer revisiedatums
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          TODAY=$(date +%Y-%m-%d)

          ####################################
          # Projectgegevens ophalen
          ####################################

          PROJECT_INFO=$(gh api graphql -f query='
          query($org:String!, $number:Int!) {
            organization(login:$org) {
              projectV2(number:$number) {
                id
                field(name:"Status") {
                  ... on ProjectV2SingleSelectField {
                    id
                    options {
                      id
                      name
                    }
                  }
                }
              }
            }
          }' \
          -F org="$ORG" \
          -F number="$TARGET_PROJECT")

          PROJECT_ID=$(echo "$PROJECT_INFO" \
            | jq -r '.data.organization.projectV2.id')

          STATUS_FIELD_ID=$(echo "$PROJECT_INFO" \
            | jq -r '.data.organization.projectV2.field.id')

          READY_OPTION_ID=$(echo "$PROJECT_INFO" \
            | jq -r '.data.organization.projectV2.field.options[]
                | select(.name=="Ready to start")
                | .id')

          ####################################
          # Open Backlog issues ophalen
          ####################################

          gh api graphql -f query='
          query($org:String!, $number:Int!) {
            organization(login:$org) {
              projectV2(number:$number) {
                items(first:100) {
                  nodes {
                    id
                    fieldValueByName(name:"Status") {
                      ... on ProjectV2ItemFieldSingleSelectValue {
                        name
                      }
                    }
                    content {
                      ... on Issue {
                        number
                        body
                        state
                      }
                    }
                  }
                }
              }
            }
          }' \
          -F org="$ORG" \
          -F number="$TARGET_PROJECT" \
          --jq '{
            items: [
              .data.organization.projectV2.items.nodes[]
              | select(.content.state == "OPEN")
              | select(.fieldValueByName.name == "Backlog")
            ]
          }' > project-items.json

          ####################################
          # Issues controleren
          ####################################

          jq -c '.items[]' project-items.json | while IFS= read -r ITEM
          do
            NUMBER=$(echo "$ITEM" | jq -r '.content.number')
            BODY=$(echo "$ITEM" | jq -r '.content.body // ""')
            ITEM_ID=$(echo "$ITEM" | jq -r '.id')

            echo "Controle issue #$NUMBER"

            # Vorige afsluitdatum uitlezen
            if [[ "$BODY" =~ Vorige[[:space:]]afsluitdatum:[[:space:]]*([0-9]{4}-[0-9]{2}-[0-9]{2}) ]]; then
              CLOSE_DATE="${BASH_REMATCH[1]}"
            else
              echo "Geen vorige afsluitdatum gevonden."
              continue
            fi

            # Herhaaltermijn uitlezen
            if [[ "$BODY" =~ Herhaaltermijn:[[:space:]]*([0-9]+)[[:space:]]dagen ]]; then
              INTERVAL="${BASH_REMATCH[1]}"
            else
              echo "Geen herhaaltermijn gevonden."
              continue
            fi

            # Revisiedatum berekenen
            REV_DATE=$(date -d "$CLOSE_DATE + $INTERVAL days" +%Y-%m-%d)

            echo "Vorige afsluitdatum : $CLOSE_DATE"
            echo "Herhaaltermijn      : $INTERVAL dagen"
            echo "Revisiedatum        : $REV_DATE"

            # Niet verlopen: niets doen
            if [[ "$REV_DATE" > "$TODAY" ]]; then
              echo "Revisie niet verlopen."
              continue
            fi

            echo "Revisie verlopen."

            ####################################
            # Label toevoegen
            ####################################

            GH_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
              gh issue edit "$NUMBER" \
                --repo "$GITHUB_REPOSITORY" \
                --add-label "$EXPIRED_LABEL"

            ####################################
            # Status -> Ready to start
            ####################################

            gh api graphql -f query='
            mutation(
              $project:ID!,
              $item:ID!,
              $field:ID!,
              $option:String!
            ) {
              updateProjectV2ItemFieldValue(
                input:{
                  projectId:$project
                  itemId:$item
                  fieldId:$field
                  value:{
                    singleSelectOptionId:$option
                  }
                }
              ) {
                projectV2Item {
                  id
                }
              }
            }' \
            -f project="$PROJECT_ID" \
            -f item="$ITEM_ID" \
            -f field="$STATUS_FIELD_ID" \
            -f option="$READY_OPTION_ID"

            echo "Issue #$NUMBER naar Ready to start gezet."

            ####################################
            # Warning toevoegen
            ####################################

            GH_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
              gh issue comment "$NUMBER" \
                --repo "$GITHUB_REPOSITORY" \
                --body "@AnkeVanBeek-IDgis De revisietermijn voor issue #$NUMBER is verlopen."

            echo "Warning toegevoegd aan issue #$NUMBER."

          done

          echo "Workflow succesvol afgerond."
